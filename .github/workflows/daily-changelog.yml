name: Daily Changelog

on:
  schedule:
    # Runs daily at 16:17 UTC (19:17 Europe/Moscow); off the top of the hour to avoid GitHub cron delays
    - cron: '17 16 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date for changelog (YYYY-MM-DD, optional)'
        required: false
        type: string
      test:
        description: 'Test mode (adds [ТЕСТ] prefix)'
        required: false
        type: boolean
        default: false
      simulate_ai_failure:
        description: 'Simulate AI failure (for testing fallback)'
        required: false
        type: boolean
        default: false
      prompt_text:
        description: 'Песочница промпта: первые строки коммитов через || (ответ ИИ придёт админу, без кнопок)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  daily-changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Run changelog script
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ vars.ADMIN_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_TEST: ${{ inputs.test }}
          INPUT_SIMULATE_AI_FAILURE: ${{ inputs.simulate_ai_failure }}
          INPUT_PROMPT_TEXT: ${{ inputs.prompt_text }}
        run: |
          node scripts/daily-changelog.js
